name: Deploy backend

# CD (sección 2.10.4): cada cambio integrado a main se despliega solo.
# A main solo se llega por PR con el CI en verde (regla de la rama).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write # para conectarse a Azure con la identidad federada (sin contraseñas)
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Compilar
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Armar el paquete (solo dependencias de producción)
        run: |
          npm prune --omit=dev --legacy-peer-deps
          zip -qr ../backend.zip dist node_modules package.json

      - name: Conectarse a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend.zip

      - name: Comprobar que la aplicación responde (CP-S2-03)
        run: |
          url="${{ vars.AZURE_WEBAPP_URL }}/salud"
          for intento in $(seq 1 20); do
            respuesta=$(curl -s -o /tmp/salud.json -w '%{http_code}' "$url" || true)
            if [ "$respuesta" = "200" ]; then
              echo "GET $url -> 200 $(cat /tmp/salud.json)"
              exit 0
            fi
            echo "Intento $intento: $respuesta; reintento en 15 s"
            sleep 15
          done
          echo "La aplicación no respondió en $url"
          exit 1
